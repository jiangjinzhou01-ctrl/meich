name: Validate experience changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  production-builds:
    runs-on: ubuntu-latest
    env:
      MGC_QA_REPORT: v3.0-motion.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:search
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /meich
          NEXT_PUBLIC_SITE_URL: https://jiangjinzhou01-ctrl.github.io/meich
      - run: npm run check:export
      - name: Install isolated browser QA tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/mgc-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/mgc-qa/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run check:v3
        env:
          MGC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mgc-qa/node_modules/playwright
      - run: npm run check:swipe
        env:
          MGC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mgc-qa/node_modules/playwright
      - uses: actions/upload-artifact@v4
        with:
          name: mgc-v3-pages-preview
          path: out/
      - run: npm run build:server
      - run: npm run package:server
      - run: npm run check:motion
        env:
          MGC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mgc-qa/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgc-v3-browser-evidence
          path: |
            docs/qa/v3.0-browser.json
            docs/qa/v3.0-motion.json
            docs/qa/swipe-regression.json
            docs/qa/v3.0/
            docs/qa/culture-touch/
            docs/qa/motion-*.png
