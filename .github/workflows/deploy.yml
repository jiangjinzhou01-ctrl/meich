# deployment trigger: restore custom GitHub Pages workflow
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_content:
        description: Refresh public content from mgcdigi.com before deployment
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: github.event.inputs.refresh_content == 'true'
        with:
          python-version: "3.12"
      - name: Refresh public source content
        if: github.event.inputs.refresh_content == 'true'
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/sync-source.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:search
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /meich
          NEXT_PUBLIC_SITE_URL: https://jiangjinzhou01-ctrl.github.io/meich
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
      - run: npm run check:export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
